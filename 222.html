<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <meta name="theme-color" content="#0a0a1a">
    <title>الفتح - إدارة المخزون</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --primary: #2563eb;
            --primary-light: #3b82f6;
            --primary-gradient: linear-gradient(135deg, #2563eb, #7c3aed);
            --success: #10b981;
            --success-light: #34d399;
            --danger: #ef4444;
            --danger-light: #f87171;
            --warning: #f59e0b;
            --bg: #0a0a1a;
            --bg-card: #13132e;
            --bg-card-hover: #1a1a3e;
            --bg-input: #0f0f24;
            --text: #ffffff;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --border: #1e1e4a;
            --shadow: 0 8px 32px rgba(0,0,0,0.5);
            --shadow-hover: 0 12px 48px rgba(37,99,235,0.15);
            --radius: 16px;
            --radius-sm: 10px;
            --radius-lg: 24px;
            --transition: all 0.3s ease;
            --font: 'Cairo', sans-serif;
        }
        
        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            background-image: radial-gradient(ellipse at 50% 0%, rgba(37,99,235,0.05) 0%, transparent 70%);
        }
        
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 10px; }
        
        .header {
            position: fixed;
            top: 0; left: 0; right: 0;
            background: rgba(10,10,26,0.92);
            backdrop-filter: blur(20px);
            padding: 10px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            border-bottom: 1px solid var(--border);
            height: 56px;
            box-shadow: 0 4px 30px rgba(0,0,0,0.3);
        }
        
        .logo {
            font-size: 18px;
            font-weight: 900;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .logo i { -webkit-text-fill-color: var(--primary-light); font-size: 20px; }
        
        .header-actions { display: flex; align-items: center; gap: 6px; }
        
        .btn-icon {
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border);
            width: 36px; height: 36px;
            border-radius: 50%;
            color: var(--text-secondary);
            font-size: 14px;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .btn-icon:hover { background: var(--primary); color: white; border-color: var(--primary); transform: scale(1.05); }
        .btn-icon:active { transform: scale(0.9); }
        
        .btn-badge {
            position: absolute;
            top: -4px;
            right: -4px;
            background: var(--danger);
            color: white;
            font-size: 9px;
            font-weight: 700;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .btn-back {
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            padding: 5px 14px;
            border-radius: 50px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .btn-back:hover { background: var(--primary); color: white; border-color: var(--primary); }
        .btn-back:active { transform: scale(0.95); }
        .btn-back i { margin-left: 4px; }
        
        .btn-add {
            background: rgba(16,185,129,0.15);
            border: 1px solid var(--success);
            color: var(--success-light);
            padding: 5px 14px;
            border-radius: 50px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .btn-add:hover { background: var(--success); color: white; transform: scale(1.02); }
        .btn-add:active { transform: scale(0.95); }
        .btn-add i { font-size: 13px; }
        
        .btn-refresh {
            background: rgba(37,99,235,0.15);
            border: 1px solid var(--primary);
            color: var(--primary-light);
        }
        .btn-refresh:hover { background: var(--primary); color: white; }
        
        .btn-cart {
            background: rgba(245,158,11,0.15);
            border: 1px solid var(--warning);
            color: var(--warning);
        }
        .btn-cart:hover { background: var(--warning); color: var(--bg); }
        
        .bottom-nav {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            background: rgba(10,10,26,0.95);
            backdrop-filter: blur(20px);
            display: flex;
            padding: 6px 0 env(safe-area-inset-bottom, 6px);
            border-top: 1px solid var(--border);
            z-index: 1000;
            height: 60px;
            box-shadow: 0 -4px 30px rgba(0,0,0,0.3);
        }
        
        .nav-item {
            flex: 1;
            text-align: center;
            padding: 4px 2px;
            color: var(--text-muted);
            cursor: pointer;
            transition: var(--transition);
            border-radius: 12px;
            position: relative;
        }
        .nav-item i { font-size: 18px; display: block; margin-bottom: 2px; }
        .nav-item span { font-size: 8px; font-weight: 600; letter-spacing: 0.3px; }
        .nav-item.active { color: var(--primary-light); }
        .nav-item.active::before {
            content: '';
            position: absolute;
            top: -1px;
            left: 50%;
            transform: translateX(-50%);
            width: 24px;
            height: 3px;
            background: var(--primary-gradient);
            border-radius: 0 0 10px 10px;
        }
        .nav-item:hover { color: var(--text); }
        .nav-item:active { transform: scale(0.9); }
        
        .main { padding: 68px 14px 72px; max-width: 480px; margin: 0 auto; }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 18px;
        }
        .stat-card {
            background: var(--bg-card);
            padding: 14px 8px;
            border-radius: var(--radius);
            text-align: center;
            border: 1px solid var(--border);
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }
        .stat-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2px;
            background: var(--primary-gradient);
        }
        .stat-card:hover { border-color: var(--primary); transform: translateY(-2px); box-shadow: var(--shadow-hover); }
        .stat-card .stat-number {
            font-size: 22px;
            font-weight: 900;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1.2;
        }
        .stat-card .stat-label { font-size: 9px; color: var(--text-muted); margin-top: 4px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
        .stat-card .stat-icon { position: absolute; bottom: 4px; right: 6px; font-size: 24px; opacity: 0.05; }
        
        .action-cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 18px;
        }
        .action-card {
            background: var(--bg-card);
            border: 2px solid var(--border);
            border-radius: var(--radius);
            padding: 18px 10px;
            text-align: center;
            cursor: pointer;
            transition: var(--transition);
        }
        .action-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-hover); }
        .action-card:active { transform: scale(0.94); }
        .action-card .icon { font-size: 30px; display: block; margin-bottom: 8px; }
        .action-card .label { font-size: 13px; font-weight: 700; }
        .action-card .desc { font-size: 9px; color: var(--text-muted); margin-top: 3px; }
        
        .action-card.income { border-color: rgba(16,185,129,0.3); }
        .action-card.income .icon { color: var(--success-light); }
        .action-card.income:hover { border-color: var(--success); box-shadow: 0 8px 32px rgba(16,185,129,0.15); }
        
        .action-card.outcome { border-color: rgba(239,68,68,0.3); }
        .action-card.outcome .icon { color: var(--danger-light); }
        .action-card.outcome:hover { border-color: var(--danger); box-shadow: 0 8px 32px rgba(239,68,68,0.15); }
        
        .action-card.exchange { border-color: rgba(124,58,237,0.3); }
        .action-card.exchange .icon { color: #a78bfa; }
        .action-card.exchange:hover { border-color: #7c3aed; box-shadow: 0 8px 32px rgba(124,58,237,0.15); }
        
        .quick-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 18px;
        }
        .quick-actions button {
            padding: 10px;
            font-size: 11px;
            border-radius: 50px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            cursor: pointer;
            transition: var(--transition);
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .quick-actions button:hover { border-color: var(--primary); color: var(--text); box-shadow: var(--shadow-hover); }
        .quick-actions button:active { transform: scale(0.95); }
        .quick-actions button i { font-size: 14px; color: var(--primary-light); }
        
        .page-title {
            font-size: 17px;
            font-weight: 800;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .page-title .sub { font-size: 12px; font-weight: 400; color: var(--text-muted); }
        .page-title .spacer { flex: 1; }
        
        .famille-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }
        .famille-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px 12px;
            text-align: center;
            cursor: pointer;
            position: relative;
            transition: var(--transition);
            overflow: hidden;
        }
        .famille-card::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2px;
            background: var(--primary-gradient);
            opacity: 0;
            transition: var(--transition);
        }
        .famille-card:hover { border-color: var(--primary); transform: translateY(-4px); box-shadow: var(--shadow-hover); }
        .famille-card:hover::after { opacity: 1; }
        .famille-card:active { transform: scale(0.95); }
        .famille-card .famille-image {
            width: 56px; height: 56px;
            border-radius: 12px;
            object-fit: cover;
            background: var(--bg-input);
            margin-bottom: 8px;
        }
        .famille-card .famille-image-placeholder {
            width: 56px; height: 56px;
            border-radius: 12px;
            background: var(--bg-input);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            margin: 0 auto 8px;
        }
        .famille-card .famille-name { font-size: 14px; font-weight: 700; }
        .famille-card .famille-count { font-size: 10px; color: var(--text-muted); margin-top: 3px; }
        
        .product-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }
        .product-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 14px 10px;
            text-align: center;
            cursor: pointer;
            position: relative;
            transition: var(--transition);
            overflow: hidden;
        }
        .product-card::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2px;
            background: var(--primary-gradient);
            opacity: 0;
            transition: var(--transition);
        }
        .product-card:hover { border-color: var(--primary); transform: translateY(-3px); box-shadow: var(--shadow-hover); }
        .product-card:hover::after { opacity: 1; }
        .product-card:active { transform: scale(0.95); }
        .product-card .product-image {
            width: 44px; height: 44px;
            border-radius: 10px;
            object-fit: cover;
            background: var(--bg-input);
            margin: 0 auto 6px;
        }
        .product-card .product-name { font-size: 13px; font-weight: 700; }
        .product-card .product-stock { font-size: 10px; color: var(--text-muted); margin-top: 3px; }
        .product-card .product-stock.low { color: var(--danger-light); }
        .product-card .add-to-cart-btn {
            position: absolute;
            bottom: 6px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--warning);
            border: none;
            color: var(--bg);
            font-size: 9px;
            font-weight: 700;
            padding: 2px 10px;
            border-radius: 50px;
            cursor: pointer;
            transition: var(--transition);
            opacity: 0;
        }
        .product-card:hover .add-to-cart-btn { opacity: 1; }
        .product-card .add-to-cart-btn:active { transform: translateX(-50%) scale(0.9); }
        .product-card .in-cart-badge {
            position: absolute;
            top: 4px;
            right: 4px;
            background: var(--success);
            color: white;
            font-size: 8px;
            font-weight: 700;
            padding: 1px 8px;
            border-radius: 50px;
        }
        
        .modal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(20px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            padding: 16px;
            animation: modalFade 0.25s ease;
        }
        .modal.active { display: flex; }
        
        @keyframes modalFade {
            from { opacity: 0; transform: scale(0.92) translateY(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        
        .modal-content {
            background: var(--bg-card);
            width: 100%;
            max-width: 420px;
            border-radius: var(--radius-lg);
            padding: 22px;
            max-height: 90vh;
            overflow-y: auto;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            font-size: 16px;
            font-weight: 800;
        }
        .modal-header .close-btn {
            background: rgba(255,255,255,0.05);
            border: none;
            width: 32px; height: 32px;
            border-radius: 50%;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 15px;
            transition: var(--transition);
        }
        .modal-header .close-btn:hover { background: rgba(255,255,255,0.1); color: white; }
        .modal-header .close-btn:active { transform: scale(0.8); }
        
        .modal-product-info {
            text-align: center;
            padding: 12px;
            background: var(--bg-input);
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            margin-bottom: 16px;
        }
        .modal-product-info .name { font-size: 15px; font-weight: 700; }
        .modal-product-info .stock { font-size: 11px; color: var(--text-muted); margin-top: 3px; }
        .modal-product-info .product-image {
            width: 56px; height: 56px;
            border-radius: 12px;
            object-fit: cover;
            margin: 0 auto 6px;
        }
        
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 10px; font-weight: 700; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
        
        input, select, textarea {
            width: 100%;
            padding: 10px 14px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text);
            font-size: 13px;
            font-family: var(--font);
            outline: none;
            text-align: right;
            transition: var(--transition);
        }
        input:focus, select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37,99,235,0.15); }
        input::placeholder { color: var(--text-muted); }
        
        .quantity-selector {
            display: flex;
            align-items: center;
            gap: 12px;
            justify-content: center;
        }
        .qty-btn {
            width: 40px; height: 40px;
            border-radius: 50%;
            background: var(--bg-input);
            border: 1px solid var(--border);
            color: var(--text);
            font-size: 18px;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .qty-btn:hover { background: var(--primary); border-color: var(--primary); }
        .qty-btn:active { transform: scale(0.8); }
        
        .qty-input {
            text-align: center;
            font-size: 24px;
            font-weight: 700;
            width: 80px;
            background: transparent;
            border: none;
            border-bottom: 2px solid var(--border);
            color: var(--text);
            padding: 4px 2px;
            -moz-appearance: textfield;
        }
        .qty-input::-webkit-outer-spin-button,
        .qty-input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        .qty-input:focus { 
            border-bottom-color: var(--primary);
            box-shadow: none;
            outline: none;
        }
        .qty-input::placeholder {
            color: var(--text-muted);
            font-size: 16px;
            font-weight: 400;
        }
        
        button {
            background: var(--primary-gradient);
            border: none;
            padding: 12px 20px;
            border-radius: 50px;
            color: white;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            width: 100%;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        button:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(37,99,235,0.3); }
        button:active { transform: scale(0.95); }
        button.success { background: linear-gradient(135deg, #10b981, #059669); }
        button.success:hover { box-shadow: 0 8px 30px rgba(16,185,129,0.3); }
        button.danger { background: linear-gradient(135deg, #ef4444, #dc2626); }
        button.danger:hover { box-shadow: 0 8px 30px rgba(239,68,68,0.3); }
        button.exchange-btn { background: linear-gradient(135deg, #7c3aed, #6d28d9); }
        button.exchange-btn:hover { box-shadow: 0 8px 30px rgba(124,58,237,0.3); }
        button.secondary {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-secondary);
        }
        button.secondary:hover { border-color: var(--text); color: var(--text); box-shadow: none; }
        button.warning-btn { background: linear-gradient(135deg, #f59e0b, #d97706); color: var(--bg); }
        button.warning-btn:hover { box-shadow: 0 8px 30px rgba(245,158,11,0.3); }
        button.pdf-btn { background: linear-gradient(135deg, #dc2626, #991b1b); }
        button.pdf-btn:hover { box-shadow: 0 8px 30px rgba(220,38,38,0.3); }
        
        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 16px;
        }
        .modal-actions button { flex: 1; }
        .modal-actions .cancel-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-secondary);
            flex: 0.4;
        }
        .modal-actions .cancel-btn:hover { border-color: var(--text); color: var(--text); box-shadow: none; }
        
        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            background: var(--bg-input);
            border-radius: var(--radius-sm);
            margin-bottom: 8px;
            border: 1px solid var(--border);
            flex-wrap: wrap;
            gap: 4px;
        }
        .cart-item .cart-item-info { flex: 1; min-width: 100px; }
        .cart-item .cart-item-name { font-weight: 600; font-size: 13px; }
        .cart-item .cart-item-stock { font-size: 9px; color: var(--text-muted); }
        .cart-item .cart-item-actions {
            display: flex;
            align-items: center;
            gap: 4px;
            flex-wrap: wrap;
        }
        .cart-item .cart-item-actions .qty-btn-sm {
            width: 28px; height: 28px;
            border-radius: 50%;
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .cart-item .cart-item-actions .qty-btn-sm:active { transform: scale(0.8); }
        
        .cart-item .cart-item-actions .qty-input-manual {
            width: 80px;
            height: 34px;
            text-align: center;
            font-weight: 700;
            font-size: 18px;
            background: var(--bg);
            border: 2px solid var(--border);
            border-radius: 8px;
            color: var(--text);
